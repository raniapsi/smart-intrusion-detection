# Root Docker Compose orchestrating the live demo path:
#
#   alert-sender (optional) → middleware → Kafka (events.raw)
#                                          ↓
#                                   ai-backend consumer
#                                          ↓
#                                Kafka (events.enriched, alerts.critical)
#                                          ↓
#                                       dashboard
#
# HTTP fallback is also wired (middleware → ai-backend POST /api/ingest/events)
# in case Kafka is unavailable. Both paths can run simultaneously.

services:

  # --------------------------------------------------------------------------
  # Kafka stack
  # --------------------------------------------------------------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: smart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Whitelist the "ruok" four-letter word so the healthcheck can call it.
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    healthcheck:
      # cub is shipped in every Confluent image; it polls a port until it's
      # reachable. Much more reliable than netcat-based shells, which aren't
      # always installed in slim images.
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "10"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smart-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for inter-container (PLAINTEXT://kafka:9092)
      # and one for the host (PLAINTEXT_HOST://localhost:9092). Keeps the
      # rest of the stack agnostic to whether they're inside or outside Docker.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Disable auto-creation: we want kafka-init to declare topics with
      # explicit retention so the README guarantees are documented in code.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      # cub is the official Confluent ready-checker. It returns 0 when the
      # broker has finished registering with ZK and accepts client connections.
      test: ["CMD", "cub", "kafka-ready", "-b", "localhost:9092", "1", "10"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # One-shot service that creates the four canonical topics with the
  # retention policies declared in the README architecture document.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smart-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # Retention values match the README:
    #   events.raw       = 7 days
    #   events.enriched  = 30 days
    #   alerts.critical  = 90 days
    #   logs.signed      = 15 years (~5475 days; Kafka uses ms)
    command:
      - |
        set -e
        echo 'creating Kafka topics...'
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic events.raw --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000

        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic events.enriched --partitions 3 --replication-factor 1 \
          --config retention.ms=2592000000

        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic alerts.critical --partitions 1 --replication-factor 1 \
          --config retention.ms=7776000000

        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic logs.signed --partitions 1 --replication-factor 1 \
          --config retention.ms=473040000000

        echo 'topics:' && kafka-topics --bootstrap-server kafka:9092 --list
    restart: "no"

  # --------------------------------------------------------------------------
  # Application services
  # --------------------------------------------------------------------------

  ai-backend:
    build:
      context: ./ai-engine
    container_name: smart-ai-backend
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_RAW: events.raw
      KAFKA_TOPIC_ENRICHED: events.enriched
      KAFKA_TOPIC_ALERTS: alerts.critical
      KAFKA_GROUP: ai-engine-scoring
    command:
      - python
      - -m
      - backend.cli
      - serve
      - --topology
      - dataset/topology/building_b1.yaml
      - --baselines
      - features/output/baselines.json
      - --model
      - models/trained/isoforest.joblib
      - --kafka-brokers
      - kafka:9092
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-replay
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/score/current', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  middleware:
    build:
      context: ./middleware
    container_name: smart-middleware
    ports:
      - "8010:8010"
    environment:
      APP_NAME: smart-intrusion-detection
      APP_ENV: development
      DEBUG: "true"
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8010"
      AI_ENGINE_URL: http://ai-backend:8000
      AI_FORWARD_ENABLED: "true"          # HTTP fallback enabled
      KAFKA_ENABLED: "true"               # Kafka primary path enabled
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_RAW: events.raw
      BUILDING_ID: B1
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      DATABASE_URL: postgresql://user:password@timescaledb:5432/intrusion_db
      RISK_THRESHOLD_SUSPECT: "50"
      RISK_THRESHOLD_CRITICAL: "80"
    depends_on:
      ai-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./ai-engine/frontend
    container_name: smart-dashboard
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://ai-backend:8000
      VITE_WS_PROXY_TARGET: ws://ai-backend:8000
    depends_on:
      ai-backend:
        condition: service_healthy
    restart: unless-stopped

  alert-sender:
    build:
      context: ./middleware
    container_name: smart-alert-sender
    profiles:
      - alerts
    command:
      - python
      - scripts/auto_alerts.py
      - --url
      - http://middleware:8010/api/events
      - --interval
      - ${ALERT_INTERVAL:-5}
      - --jitter
      - ${ALERT_JITTER:-1}
    depends_on:
      middleware:
        condition: service_healthy
    restart: unless-stopped
